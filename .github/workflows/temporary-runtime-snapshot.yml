name: Temporary runtime failure source snapshot

on:
  push:
    branches: [agent/runtime-failure-orchestration-20260712]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/source-snapshot.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-failure-source
          path: ${{ runner.temp }}/source-snapshot.tar.gz
          retention-days: 1
