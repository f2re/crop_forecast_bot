name: Live provider smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-smoke.yml"
      - "requirements*.txt"
      - "src/agro/climate_reference.py"
      - "src/api/open_meteo.py"
      - "src/api/open_meteo_climate.py"
      - "src/api/open_meteo_soil.py"
      - "src/application/ports/soil_temperature.py"
      - "src/domain/soil_temperature.py"
      - "src/ops/provider_smoke.py"
      - "src/ops/climate_smoke.py"
      - "src/ops/soil_temperature_smoke.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-smoke.yml"
      - "requirements*.txt"
      - "src/agro/climate_reference.py"
      - "src/api/open_meteo.py"
      - "src/api/open_meteo_climate.py"
      - "src/api/open_meteo_soil.py"
      - "src/application/ports/soil_temperature.py"
      - "src/domain/soil_temperature.py"
      - "src/ops/provider_smoke.py"
      - "src/ops/climate_smoke.py"
      - "src/ops/soil_temperature_smoke.py"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  statuses: write

concurrency:
  group: live-provider-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPEN_METEO_CACHE_PATH: ${{ github.workspace }}/.cache/openmeteo
      STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: "pending",
              context: "live-provider-smoke",
              description: "Open-Meteo weather, climate and soil contracts are running",
              target_url: process.env.RUN_URL,
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Operational Forecast/Historical contract
        shell: bash
        run: |
          set -Eeuo pipefail
          season_start="$(date -u -d '45 days ago' +%F)"
          python -m src.ops.provider_smoke \
            --latitude 55.75 \
            --longitude 37.62 \
            --season-start "${season_start}" | tee operational-smoke.json

      - name: Near-surface soil-temperature contract
        shell: bash
        run: |
          set -Eeuo pipefail
          soil_start="$(date -u -d '45 days ago' +%F)"
          python -m src.ops.soil_temperature_smoke \
            --latitude 55.75 \
            --longitude 37.62 \
            --start "${soil_start}" | tee soil-temperature-smoke.json

      - name: Homogeneous ERA5 current/reference contract
        shell: bash
        run: |
          set -Eeuo pipefail
          season_start="$(date -u -d '45 days ago' +%F)"
          python -m src.ops.climate_smoke \
            --latitude 55.75 \
            --longitude 37.62 \
            --season-start "${season_start}" \
            --crop wheat | tee climate-smoke.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-smoke-${{ github.run_id }}
          path: |
            operational-smoke.json
            soil-temperature-smoke.json
            climate-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: succeeded ? "success" : "failure",
              context: "live-provider-smoke",
              description: succeeded
                ? "Weather, climate and soil live contracts passed"
                : "A live provider contract failed; inspect the run",
              target_url: process.env.RUN_URL,
            });
