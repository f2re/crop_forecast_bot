name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      TEST_DATABASE_URL: postgresql+asyncpg://cropbot_test:cropbot_test@127.0.0.1:5432/crop_forecast_bot_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install validation dependencies and local services
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck postgresql postgresql-client redis-server
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Start PostgreSQL and Redis
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'cropbot_test'
            ) THEN
              CREATE ROLE cropbot_test LOGIN PASSWORD 'cropbot_test';
            ELSE
              ALTER ROLE cropbot_test WITH LOGIN PASSWORD 'cropbot_test';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE crop_forecast_bot_test OWNER cropbot_test'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'crop_forecast_bot_test'
          )
          \gexec
          GRANT ALL PRIVILEGES ON DATABASE crop_forecast_bot_test TO cropbot_test;
          SQL
          pg_isready -h 127.0.0.1 -p 5432 -d crop_forecast_bot_test
          redis-cli -n 15 ping | grep -qx PONG

      - name: Python static checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            ruff check src config alembic tests
            python -m compileall -q alembic config src tests
          } 2>&1 | tee artifacts/static-checks.log

      - name: Bash syntax
        run: bash -n scripts/*.sh

      - name: Shellcheck native operations
        run: |
          shellcheck -x \
            scripts/common.sh \
            scripts/deploy.sh \
            scripts/update.sh \
            scripts/rollback.sh \
            scripts/status.sh \
            scripts/help.sh \
            scripts/install-systemd.sh \
            scripts/install-github-deploy-trigger.sh \
            scripts/configure-github-deploy.sh \
            scripts/verify-production.sh \
            scripts/verify-backup-restore.sh

      - name: Repository legacy policy
        run: |
          for path in \
            Dockerfile \
            docker-compose.yml \
            .env.docker.example \
            main.py \
            run_bot.py \
            scripts/train_basic_model.py \
            scripts/deploy_to_platform.sh \
            src/bot/simple_recommender.py; do
            test ! -e "${path}"
          done

      - name: Repository scientific-claims policy
        run: |
          set +e
          matches="$(grep -R --line-number --include='*.py' \
            -E 'RandomForestClassifier|synthetic_crop_data|yield_estimate' \
            src scripts 2>&1)"
          status=$?
          set -e
          case "${status}" in
            0)
              printf '%s\n' "${matches}"
              echo "Forbidden synthetic-model marker found" >&2
              exit 1
              ;;
            1)
              ;;
            *)
              printf '%s\n' "${matches}" >&2
              echo "Repository policy scan failed" >&2
              exit "${status}"
              ;;
          esac

      - name: Production MVP startup smoke
        env:
          APP_ENV: production
          TELEGRAM_BOT_TOKEN: 123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          RAG_ENABLED: "false"
          CLIMATE_REFERENCE_ENABLED: "false"
          BLOCKING_IO_WORKERS: "1"
          RISK_CHECK_ON_STARTUP: "true"
          RISK_CHECK_STARTUP_DELAY_SECONDS: "120"
        run: |
          python -m alembic upgrade head
          python -m src.bot.main --startup-smoke

      - name: Unit and contract tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q -m "not integration" 2>&1 | tee artifacts/unit-tests.log

      - name: PostgreSQL and Redis integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q -m integration 2>&1 | tee artifacts/integration-tests.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ github.run_id }}
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Backup and restore round trip
        shell: bash
        run: |
          set -Eeuo pipefail
          export DATABASE_URL="${TEST_DATABASE_URL}"
          python -m alembic upgrade head

          sudo -u postgres psql \
            --set=ON_ERROR_STOP=1 \
            --dbname=crop_forecast_bot_test <<'SQL'
          INSERT INTO users (telegram_id, username, first_name)
          VALUES (9876543210123, 'restore_smoke', 'Restore')
          ON CONFLICT (telegram_id) DO UPDATE
          SET username = EXCLUDED.username, first_name = EXCLUDED.first_name;

          INSERT INTO fields (user_id, name, latitude, longitude, timezone, is_active)
          SELECT id, 'Restore smoke field', 55.75, 37.62, 'Europe/Moscow', true
          FROM users WHERE telegram_id = 9876543210123
          ON CONFLICT (user_id, name) DO UPDATE
          SET latitude = EXCLUDED.latitude,
              longitude = EXCLUDED.longitude,
              timezone = EXCLUDED.timezone,
              is_active = EXCLUDED.is_active;

          DELETE FROM crop_seasons
          WHERE field_id = (
            SELECT f.id
            FROM fields AS f
            JOIN users AS u ON u.id = f.user_id
            WHERE u.telegram_id = 9876543210123
              AND f.name = 'Restore smoke field'
          );

          INSERT INTO crop_seasons (
            field_id, crop_key, sowing_date, season_start_date,
            phenological_phase, phase_source, is_active
          )
          SELECT f.id, 'wheat', DATE '2026-04-15', DATE '2026-04-15',
                 'Кущение', 'user', true
          FROM fields AS f
          JOIN users AS u ON u.id = f.user_id
          WHERE u.telegram_id = 9876543210123
            AND f.name = 'Restore smoke field';
          SQL

          env_file="${RUNNER_TEMP}/cropbot-restore.env"
          backup_root="${RUNNER_TEMP}/cropbot-backups"
          mkdir -p "${backup_root}"
          cat > "${env_file}" <<EOF
          TELEGRAM_BOT_TOKEN=123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL=${TEST_DATABASE_URL}
          REDIS_URL=${TEST_REDIS_URL}
          RAG_ENABLED=false
          EOF

          sudo env \
            ENV_FILE="${env_file}" \
            BACKUP_ROOT="${backup_root}" \
            KEEP_BACKUPS=2 \
            bash -c 'source scripts/common.sh; backup_database'
          sudo env \
            ENV_FILE="${env_file}" \
            BACKUP_ROOT="${backup_root}" \
            bash scripts/verify-backup-restore.sh

      - name: Alembic graph
        run: python -m alembic heads

  python-310:
    name: Python 3.10 compatibility (Ubuntu 22.04 runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python 3.10 validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Compile and run non-integration tests on Python 3.10
        run: |
          python -m compileall -q alembic config src tests
          python -m pytest -q -m "not integration"

  live-provider:
    name: Live provider contracts (relevant PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPEN_METEO_CACHE_PATH: ${{ github.workspace }}/.cache/openmeteo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect provider-contract changes
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "${changed}"
          if grep -Eq '^(\.github/workflows/(ci|provider-smoke)\.yml|requirements[^/]*\.txt|src/(agro/climate_reference|api/open_meteo|api/open_meteo_climate|ops/provider_smoke|ops/climate_smoke)\.py)$' <<<"${changed}"; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install production dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Operational Forecast/Historical contract
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          season_start="$(date -u -d '45 days ago' +%F)"
          python -m src.ops.provider_smoke \
            --latitude 55.75 \
            --longitude 37.62 \
            --season-start "${season_start}" | tee operational-smoke.json

      - name: Homogeneous ERA5 current/reference contract
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          season_start="$(date -u -d '45 days ago' +%F)"
          python -m src.ops.climate_smoke \
            --latitude 55.75 \
            --longitude 37.62 \
            --season-start "${season_start}" \
            --crop wheat | tee climate-smoke.json

      - name: Upload live provider evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-live-provider-smoke-${{ github.run_id }}
          path: |
            operational-smoke.json
            climate-smoke.json
          if-no-files-found: warn
          retention-days: 14
