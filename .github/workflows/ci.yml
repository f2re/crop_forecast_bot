name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Python static checks
        run: |
          ruff check src config alembic tests
          python -m compileall -q alembic config src tests

      - name: Bash syntax
        run: bash -n scripts/*.sh

      - name: Shellcheck native operations
        run: |
          shellcheck -x \
            scripts/common.sh \
            scripts/deploy.sh \
            scripts/update.sh \
            scripts/rollback.sh \
            scripts/status.sh \
            scripts/help.sh \
            scripts/install-systemd.sh \
            scripts/verify-production.sh

      - name: Repository legacy policy
        run: |
          for path in \
            Dockerfile \
            docker-compose.yml \
            .env.docker.example \
            main.py \
            run_bot.py \
            scripts/train_basic_model.py \
            scripts/deploy_to_platform.sh \
            src/bot/simple_recommender.py; do
            test ! -e "${path}"
          done

      - name: Repository scientific-claims policy
        run: |
          if grep -R --line-number --include='*.py' \
            -E 'RandomForestClassifier|synthetic_crop_data|yield_estimate' \
            src scripts; then
            echo "Forbidden synthetic-model marker found" >&2
            exit 1
          fi

      - name: Unit and contract tests
        run: python -m pytest -q

      - name: Alembic graph
        run: python -m alembic heads
