name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      TEST_DATABASE_URL: postgresql+asyncpg://cropbot_test:cropbot_test@127.0.0.1:5432/crop_forecast_bot_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install validation dependencies and local services
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck postgresql postgresql-client redis-server
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Start PostgreSQL and Redis
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'cropbot_test'
            ) THEN
              CREATE ROLE cropbot_test LOGIN PASSWORD 'cropbot_test';
            ELSE
              ALTER ROLE cropbot_test WITH LOGIN PASSWORD 'cropbot_test';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE crop_forecast_bot_test OWNER cropbot_test'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'crop_forecast_bot_test'
          )
          \gexec
          GRANT ALL PRIVILEGES ON DATABASE crop_forecast_bot_test TO cropbot_test;
          SQL
          pg_isready -h 127.0.0.1 -p 5432 -d crop_forecast_bot_test
          redis-cli -n 15 ping | grep -qx PONG

      - name: Python static checks
        run: |
          ruff check src config alembic tests
          python -m compileall -q alembic config src tests

      - name: Bash syntax
        run: bash -n scripts/*.sh

      - name: Shellcheck native operations
        run: |
          shellcheck -x \
            scripts/common.sh \
            scripts/deploy.sh \
            scripts/update.sh \
            scripts/rollback.sh \
            scripts/status.sh \
            scripts/help.sh \
            scripts/install-systemd.sh \
            scripts/verify-production.sh

      - name: Repository legacy policy
        run: |
          for path in \
            Dockerfile \
            docker-compose.yml \
            .env.docker.example \
            main.py \
            run_bot.py \
            scripts/train_basic_model.py \
            scripts/deploy_to_platform.sh \
            src/bot/simple_recommender.py; do
            test ! -e "${path}"
          done

      - name: Repository scientific-claims policy
        run: |
          set +e
          matches="$(grep -R --line-number --include='*.py' \
            -E 'RandomForestClassifier|synthetic_crop_data|yield_estimate' \
            src scripts 2>&1)"
          status=$?
          set -e
          case "${status}" in
            0)
              printf '%s\n' "${matches}"
              echo "Forbidden synthetic-model marker found" >&2
              exit 1
              ;;
            1)
              ;;
            *)
              printf '%s\n' "${matches}" >&2
              echo "Repository policy scan failed" >&2
              exit "${status}"
              ;;
          esac

      - name: Unit and contract tests
        run: python -m pytest -q -m "not integration"

      - name: PostgreSQL and Redis integration tests
        run: python -m pytest -q -m integration

      - name: Alembic graph
        run: python -m alembic heads
