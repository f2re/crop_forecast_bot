name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio ruff \
            pandas numpy python-dotenv \
            aiogram redis SQLAlchemy asyncpg APScheduler \
            openmeteo-requests requests-cache retry-requests
      - name: Static checks for the migrated runtime
        run: |
          ruff check \
            config/settings.py \
            src/domain \
            src/application \
            src/agro/indices.py \
            src/api/open_meteo.py \
            src/bot/main.py \
            src/bot/handlers \
            src/bot/keyboards.py \
            src/bot/scheduler.py \
            src/ops \
            tests
          python -m compileall -q config src tests
      - name: Unit tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        id: docker_build
        shell: bash
        run: |
          set +e
          docker buildx build \
            --progress=plain \
            --tag crop-forecast-bot:ci \
            --load \
            . > docker-build.log 2>&1
          status=$?
          if [[ ${status} -ne 0 ]]; then
            tail -n 80 docker-build.log
          fi
          exit ${status}
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log
          if-no-files-found: error
          retention-days: 7
