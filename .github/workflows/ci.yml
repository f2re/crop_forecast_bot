name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio ruff \
            pandas numpy python-dotenv \
            aiogram redis SQLAlchemy asyncpg APScheduler \
            openmeteo-requests requests-cache retry-requests
      - name: Static checks for the migrated runtime
        run: |
          ruff check \
            config/settings.py \
            src/domain \
            src/application \
            src/agro/indices.py \
            src/api/open_meteo.py \
            src/bot/main.py \
            src/bot/handlers \
            src/bot/keyboards.py \
            src/bot/scheduler.py \
            src/ops \
            tests
          python -m compileall -q config src tests
      - name: Unit tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: crop-forecast-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
