name: Apply runtime failure patch

on:
  push:
    branches: [agent/runtime-failure-orchestration-20260712]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-failure-orchestration-20260712

      - name: Apply verified patch
        shell: bash
        run: |
          set -Eeuo pipefail
          patch -p1 < .automation/runtime-failure.patch
          python -m compileall -q src tests
          rm -f .automation/runtime-failure.patch
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/apply-runtime-failure-patch.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): renew scheduler leases and keep writes atomic"
          git push origin HEAD:agent/runtime-failure-orchestration-20260712
