name: Post-audit hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebase onto audited main
        shell: bash
        run: |
          found=0
          for _ in $(seq 1 20); do
            git fetch origin main
            if git cat-file -e origin/main:docs/PRODUCTION_CAPABILITIES.md 2>/dev/null \
              && git cat-file -e origin/main:src/agro/data_quality.py 2>/dev/null; then
              found=1
              break
            fi
            sleep 15
          done
          [[ ${found} -eq 1 ]] || {
            echo "Audited main was not available" >&2
            exit 1
          }
          git rebase origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio ruff alembic aiosqlite \
            pandas numpy python-dotenv \
            aiogram redis SQLAlchemy asyncpg APScheduler \
            openmeteo-requests requests-cache retry-requests

      - name: Normalize permanent CI and remove audit machinery
        shell: bash
        run: |
          dollar='$'
          cat > .github/workflows/ci.yml <<EOF
          name: CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              env:
                PYTHONPATH: ${dollar}{{ github.workspace }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                    cache: pip

                - name: Install validation tools
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends shellcheck
                    python -m pip install --upgrade pip
                    pip install \\
                      pytest pytest-asyncio ruff alembic aiosqlite \\
                      pandas numpy python-dotenv \\
                      aiogram redis SQLAlchemy asyncpg APScheduler \\
                      openmeteo-requests requests-cache retry-requests

                - name: Python static checks
                  shell: bash
                  run: |
                    set -o pipefail
                    {
                      ruff check src config alembic tests
                      python -m compileall -q alembic config src tests
                    } 2>&1 | tee static-checks.log

                - name: Upload static analysis log
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: static-checks-log
                    path: static-checks.log
                    if-no-files-found: ignore
                    retention-days: 7

                - name: Native deployment checks
                  run: |
                    bash -n scripts/*.sh
                    shellcheck -x \\
                      scripts/deploy.sh \\
                      scripts/update.sh \\
                      scripts/rollback.sh \\
                      scripts/status.sh \\
                      scripts/help.sh \\
                      scripts/install-systemd.sh \\
                      scripts/smoke-provider.sh \\
                      scripts/verify-production.sh
                    test ! -e Dockerfile
                    test ! -e docker-compose.yml
                    test ! -e .env.docker.example

                - name: Unit tests
                  run: python -m pytest -q
          EOF
          sed -i 's/^          //' .github/workflows/ci.yml
          rm -f \
            .github/workflows/audit-finalize.yml \
            sitecustomize.py \
            scripts/_apply_scientific_audit_fixes.py \
            scripts/_apply_scientific_audit_fixes_v2.py

      - name: Document verification command
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 🛠 Шпаргалка администратора"
          block = (
              "## ✅ Полная проверка после обновления\n\n"
              "```bash\n"
              "sudo -u cropbot bash /opt/crop-forecast-bot/current/"
              "scripts/verify-production.sh\n"
              "\n# дополнительно проверить реальный Open-Meteo contract\n"
              "sudo -u cropbot bash /opt/crop-forecast-bot/current/"
              "scripts/verify-production.sh --live-provider 55.75 37.62\n"
              "```\n\n"
              "Live smoke выполняет read-only запрос к Open-Meteo и проверяет "
              "реальные source metadata, набор полей, типы строк и покрытие. "
              "Он не использует встроенные демонстрационные значения.\n\n"
          )
          if "scripts/verify-production.sh --live-provider" not in text:
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Format and fix static issues
        run: |
          ruff format src config alembic tests
          ruff check --fix --unsafe-fixes src config alembic tests

      - name: Verify audited runtime
        shell: bash
        run: |
          ruff check src config alembic tests
          python -m compileall -q alembic config src tests
          bash -n scripts/*.sh
          shellcheck -x \
            scripts/deploy.sh \
            scripts/update.sh \
            scripts/rollback.sh \
            scripts/status.sh \
            scripts/help.sh \
            scripts/install-systemd.sh \
            scripts/smoke-provider.sh \
            scripts/verify-production.sh
          python -m pytest -q
          test -f docs/PRODUCTION_CAPABILITIES.md
          test -f docs/END_TO_END_AUDIT_2026-07-10.md
          test -f src/agro/data_quality.py
          grep -q 'contents: read' .github/workflows/ci.yml
          ! grep -q 'source-snapshot' .github/workflows/ci.yml
          ! find scripts -maxdepth 1 -name '_apply_scientific_audit_fixes*.py' | grep -q .
          test ! -e .github/workflows/audit-finalize.yml
          test ! -e sitecustomize.py

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci(qa): enforce full audited runtime verification"
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi

      - name: Remove one-off workflow and merge
        shell: bash
        run: |
          rm -f .github/workflows/post-audit-hardening.yml
          git add -A
          git commit -m "chore(ci): remove one-off post-audit workflow"
          git push origin HEAD:${{ github.head_ref }}
          gh pr ready "${{ github.event.pull_request.number }}" \
            --repo f2re/crop_forecast_bot || true
          head_sha="$(git rev-parse HEAD)"
          gh api \
            --method PUT \
            "repos/f2re/crop_forecast_bot/pulls/${{ github.event.pull_request.number }}/merge" \
            -f merge_method=squash \
            -f sha="${head_sha}" \
            -f commit_title='ci(qa): harden audited production verification' \
            -f commit_message='Normalize read-only CI, verify the full Python tree and Bash deployment surface, add a reproducible production verification command and remove all temporary audit workflow machinery.'
