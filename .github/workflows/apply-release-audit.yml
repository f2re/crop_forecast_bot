name: Apply audited release remediation

on:
  push:
    branches: [agent/end-to-end-scientific-audit-20260710]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('scripts/_apply_release_audit.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/end-to-end-scientific-audit-20260710
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio ruff alembic aiosqlite \
            pandas numpy python-dotenv \
            aiogram redis SQLAlchemy asyncpg APScheduler \
            openmeteo-requests requests-cache retry-requests

      - name: Apply audited remediation
        run: python scripts/_apply_release_audit.py

      - name: Remove one-off machinery
        run: |
          rm -f scripts/_apply_release_audit.py
          rm -f .github/workflows/apply-release-audit.yml

      - name: Validate audited tree
        run: bash scripts/verify-production.sh

      - name: Commit audited result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(science): stabilize source-aware production runtime"
          git push origin HEAD:agent/end-to-end-scientific-audit-20260710
