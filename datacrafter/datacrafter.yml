# Блок extractor определяет источник данных.
extractor:
  type: http
  url: https://agroserver.ru/top/
  # 'pattern' используется для указания, какие данные извлекать.
  # Это предположение, основанное на логике подобных инструментов.
  pattern:
    # CSS-селектор для нахождения всех строк таблицы, кроме заголовочной.
    records: "table.top_table_4 tr:not(:first-child)"
    # Определение полей для извлечения из каждой строки.
    fields:
      - name: rank
        selector: "td:nth-of-type(1)"
        type: int
      - name: title
        selector: "td:nth-of-type(2)"
      - name: visitors
        selector: "td:nth-of-type(3)"
        type: text
      - name: views
        selector: "td:nth-of-type(4)"
        type: text

# Блок processor определяет шаги обработки извлеченных данных.
processor:
  # Используем 'keymap' для переименования полей в более понятные названия.
  - type: keymap
    config:
      rank: "Позиция"
      title: "Название ресурса"
      visitors: "Посетители"
      views: "Просмотры"
  
  # Можно добавить другие обработчики, например, для очистки данных.

# Блок target определяет, куда будут сохранены итоговые данные.
target:
  # Указываем, что данные нужно сохранить в формате CSV.
  type: csv
  # Путь к итоговому файлу.
  path: "agroserver_stats.csv"
  config:
    # Режим 'overwrite' перезапишет файл, если он уже существует.
    mode: "overwrite"
    # 'header: true' добавляет строку с заголовками в CSV-файл.
    header: true
