name: crop-forecast-bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crop_forecast_bot}
      POSTGRES_USER: ${DB_USER:-cropbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: crop-forecast-bot:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-cropbot}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-crop_forecast_bot}
      REDIS_URL: redis://redis:6379/0
      HEARTBEAT_FILE: /tmp/crop_forecast_bot/heartbeat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -m src.ops.heartbeat $${HEARTBEAT_FILE} --max-age 90"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  bot_data:
  bot_logs:
